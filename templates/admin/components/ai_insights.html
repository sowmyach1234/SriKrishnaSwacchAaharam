<div class="ai-insights-section">

    <div class="section-title">
        <h2>🤖 AI Business Intelligence</h2>
        <p>Automatically generated business recommendations</p>
    </div>

    <div class="ai-grid">

        {% for insight in business_insights %}

        <div class="ai-card">

            <div class="ai-icon">
                {{ insight.icon }}
            </div>

            <div class="ai-content">

                <h3>
                    {{ insight.title }}
                </h3>

                <p>
                    {{ insight.message }}
                </p>

            </div>

        </div>

        {% endfor %}

    </div>

</div>



<style>

.ai-insights-section{

margin-top:40px;

padding:30px;

background:#ffffff;

border-radius:22px;

box-shadow:0 12px 35px rgba(0,0,0,.08);

}



.section-title{

margin-bottom:25px;

}



.section-title h2{

font-size:28px;

color:#1b5e20;

margin-bottom:8px;

}



.section-title p{

color:#666;

}



.ai-grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(320px,1fr));

gap:22px;

}



.ai-card{

display:flex;

gap:18px;

padding:22px;

border-radius:18px;

background:linear-gradient(
135deg,
#ffffff,
#f6fff6
);

border:1px solid #dcedc8;

transition:.35s;

}



.ai-card:hover{

transform:translateY(-6px);

box-shadow:0 18px 40px rgba(0,0,0,.12);

}



.ai-icon{

width:65px;

height:65px;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

font-size:30px;

background:#e8f5e9;

}



.ai-content h3{

margin-bottom:10px;

color:#1b5e20;

font-size:20px;

}



.ai-content p{

color:#555;

line-height:1.7;

}

</style>
