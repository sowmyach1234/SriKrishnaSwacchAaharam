<div class="prediction-section">

    <div class="section-title">
        <h2>🔮 AI Predictive Analytics</h2>
        <p>Forecasts generated from current business data</p>
    </div>

    <div class="prediction-grid">

        {% for item in predictions %}

        <div class="prediction-card">

            <div class="prediction-icon">
                {{ item.icon }}
            </div>

            <h3>{{ item.title }}</h3>

            <h1>{{ item.value }}</h1>

            <p>{{ item.description }}</p>

        </div>

        {% endfor %}

    </div>

</div>

<style>

.prediction-section{
margin-top:40px;
padding:30px;
background:#fff;
border-radius:20px;
box-shadow:0 12px 35px rgba(0,0,0,.08);
}

.prediction-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:20px;
}

.prediction-card{
padding:24px;
border-radius:18px;
background:linear-gradient(135deg,#ffffff,#eef9ee);
text-align:center;
transition:.35s;
border:1px solid #d9efd9;
}

.prediction-card:hover{
transform:translateY(-6px);
box-shadow:0 16px 35px rgba(0,0,0,.12);
}

.prediction-icon{
font-size:34px;
margin-bottom:15px;
}

.prediction-card h3{
color:#1b5e20;
margin-bottom:12px;
}

.prediction-card h1{
font-size:30px;
margin-bottom:10px;
color:#2e7d32;
}

.prediction-card p{
color:#666;
line-height:1.6;
}

</style>
