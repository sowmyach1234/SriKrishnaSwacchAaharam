{% extends "admin/admin_base.html" %}

{% block title %}
Edit Product
{% endblock %}

{% block page_title %}
Edit Product
{% endblock %}

{% block content %}

<div class="form-container">

    <div class="page-header">

        <div>

            <h2>Edit Product</h2>

            <p>Update product information.</p>

        </div>

        <a href="{{ url_for('admin_products.product_list') }}"
           class="btn-primary">

            ← Back to Products

        </a>

    </div>



    <form method="POST"
          enctype="multipart/form-data"
          class="product-form">

        <label>Product Name</label>

        <input
            type="text"
            name="product_name"
            value="{{ product.product_name }}"
            required>



        <label>Category</label>

        <select name="category" required>

            <option {% if product.category=="Cold Pressed Oils" %}selected{% endif %}>
                Cold Pressed Oils
            </option>

            <option {% if product.category=="Traditional Pickles" %}selected{% endif %}>
                Traditional Pickles
            </option>

            <option {% if product.category=="Organic Millets" %}selected{% endif %}>
                Organic Millets
            </option>

            <option {% if product.category=="A2 Cow Ghee" %}selected{% endif %}>
                A2 Cow Ghee
            </option>

            <option {% if product.category=="Millet Rice" %}selected{% endif %}>
                Millet Rice
            </option>

            <option {% if product.category=="Dry Fruits" %}selected{% endif %}>
                Dry Fruits
            </option>

            <option {% if product.category=="Organic Sweets" %}selected{% endif %}>
                Organic Sweets
            </option>

            <option {% if product.category=="Healthy Snacks" %}selected{% endif %}>
                Healthy Snacks
            </option>

        </select>



        <label>Description</label>

        <textarea
            name="description"
            rows="5">{{ product.description }}</textarea>



        <label>Price (₹)</label>

        <input
            type="number"
            step="0.01"
            name="price"
            value="{{ product.price }}"
            required>



        <label>Stock</label>

        <input
            type="number"
            name="stock"
            value="{{ product.stock }}"
            required>



        <label>Current Image</label>

        {% if product.image %}

        <img
            src="{{ url_for('static',
            filename='images/products/' + product.image) }}"
            class="preview-image">

        {% else %}

        <p>No image uploaded.</p>

        {% endif %}



        <label>Replace Image</label>

        <input
            type="file"
            name="image"
            accept="image/*">



        <button
            type="submit"
            class="btn-primary">

            Update Product

        </button>

    </form>

</div>

{% endblock %}
